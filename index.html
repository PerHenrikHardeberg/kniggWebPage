<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knigg Invest</title>

  <!-- Font loading (fix) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: Inter, sans-serif;
      background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
      color: #0a0a0a;
    }
    /* Make header/nav use Inter as well */
    header, nav, .nav a { font-family: Inter, sans-serif; }

    /* Keep the big title in Playfair */
    h1 {
      font-family: 'Playfair Display', serif;
      letter-spacing: -0.02em;
      color: #000;
    }
    .nav a[aria-current="page"] {
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 6px;
    }
  </style>
</head>
<body class="text-black bg-gray-100 transition-colors duration-500">
  <header class="p-6 border-b border-gray-500/80 bg-white/80 backdrop-blur-sm sticky top-0 z-10 shadow-md">
    <nav class="nav max-w-5xl mx-auto flex justify-center gap-10 text-lg font-medium">
      <a href="index.html" class="text-black hover:text-gray-600 transition">Home</a>
      <a href="about.html" class="text-black hover:text-gray-600 transition">About us</a>
      <a href="history.html" class="text-black hover:text-gray-600 transition">History</a>
    </nav>
  </header>

  <main class="flex flex-col items-center justify-center h-[80vh] text-center px-6 bg-gradient-to-b from-gray-200 to-gray-300">
    <h1 class="text-6xl font-extrabold mb-4 text-black drop-shadow-lg">Knigg Invest</h1>
    <p class="text-2xl text-black italic">“Think as difficult as possible, all the time”</p>
  </main>

  <footer class="py-8 text-center text-sm border-t border-gray-500/80 bg-white/80 backdrop-blur-sm mt-10">
    <p>© <span id="year"></span> Knigg Invest. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Active nav highlight
    const path = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav a').forEach(a => {
      const target = a.getAttribute('href');
      if ((path === '' && target.endsWith('index.html')) || path === target) {
        a.setAttribute('aria-current', 'page');
      }
    });
  </script>
</body>
</html>
